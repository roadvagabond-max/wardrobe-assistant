name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'deploy-firebase'
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: |
          if [ -d "functions" ]; then
            cd functions && npm install --legacy-peer-deps && cd ..
          fi

      - name: Clear overlapping env var from Cloud Run
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARDROBE_ASSISTANT_48E01 }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud run services update removegarmentbackground \
            --remove-env-vars=HF_TOKEN \
            --region=us-central1 \
            --project=wardrobe-assistant-48e01 \
            --quiet || true
          rm -f /tmp/sa.json

      - name: Deploy to Firebase Functions & Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules --force
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARDROBE_ASSISTANT_48E01 }}'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARDROBE_ASSISTANT_48E01 }}'
          channelId: live
          projectId: wardrobe-assistant-48e01
