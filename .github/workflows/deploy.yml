name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'deploy-firebase'
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build project
        run: npx vite build

      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WARDROBE_ASSISTANT_48E01 }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > "$HOME/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa-key.json"
          npx --yes firebase-tools deploy --only hosting --project wardrobe-assistant-48e01 --debug
