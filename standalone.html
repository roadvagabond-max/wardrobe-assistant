    // --- GEMINI 1.5/2.0 MULTIMODAL VISION CALL ---
    async function analyzeWithGeminiVision(imageBase64, onStatusUpdate, extraContext = "") {
      const activeKey = localStorage.getItem('GEMINI_API_KEY') || BAKED_GEMINI_KEY;

      if (onStatusUpdate) onStatusUpdate("🔍 Képpontok előkészítése és színelemzés...");

      // 1. Pixel szintű színelemzés
      const pixelInfo = await analyzeImagePixels(imageBase64);

      if (activeKey && imageBase64.startsWith('data:')) {
        if (onStatusUpdate) onStatusUpdate("🧠 Google Gemini AI elemzi a leírást és a fotót...");

        try {
          const parts = imageBase64.split(';base64,');
          const mimeType = parts[0].replace('data:', '') || 'image/jpeg';
          const base64Data = parts[1].replace(/\s/g, '');

          const prompt = `Te egy sokoldalú, professzionális divattanácsadó és ruhaipari szakértő vagy.
          ${extraContext ? `KIEMELTEN FONTOS WEBSHOP ADATOK ÉS TERMÉKLEÍRÁS:\n"""\n${extraContext}\n"""\n(A fenti hivatalos leírásból vedd az anyagösszetételt, pontos megnevezést, márkát és részleteket! A mellékelt fotót kiegészítésként és a vizuális stílus pontosítására használd!)` : 'Elemezd a fotót a feltöltött ruhadarabról objektíven!'}
          
          VÁLASZOLJ KIZÁRÓLAG ÉRVÉNYES JSON FORMÁTUMBAN:
          {
            "name": "Pontos és igényes magyar megnevezés (pl. 'Sötétkék Pamut Chino', 'Klasszikus Gyapjú Zakó', 'Oversized Kapucnis Pulóver')",
            "category": "outerwear" | "tops" | "bottoms" | "shoes" | "accessories",
            "subCategory": "blazer" | "shirt" | "t-shirt" | "knitwear" | "hoodie" | "trousers" | "jeans" | "shorts" | "loafers" | "sneakers" | "boots" | "jacket" | "overcoat",
            "color": "Valódi fő szín magyarul",
            "colorHex": "#színkód",
            "material": "Pontos anyagösszetétel a leírás/fotó alapján (pl. 100% Pamut, 80% Gyapjú 20% Poliamid, Borjúbőr)",
            "qualityScore": 8.8,
            "season": ["tavasz", "nyar", "osz", "tel"],
            "formality": "Casual" | "Smart Casual" | "Business Casual" | "Business / Formal" | "Streetwear",
            "stylingTip": "Releváns, a ruhadarab tényleges stílusához illeszkedő szakértői stílustipp",
            "tags": ["3-5 db releváns stílus, alkalom és anyag címke"]
          }`;

          const requestBody = {
            contents: [{
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64Data
                  }
                }
              ]
            }]
          };

          // Próbáljuk meg a Google generativelanguage v1beta végpontot
          const endpoints = [
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${activeKey}`
          ];

          for (const url of endpoints) {
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-goog-api-key': activeKey
                },
                body: JSON.stringify(requestBody)
              });

              if (res.ok) {
                const data = await res.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (rawText) {
                  // Clean markdown JSON fences if present
                  rawText = rawText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                  const aiParsed = JSON.parse(rawText);
                  if (onStatusUpdate) onStatusUpdate("✨ Google Gemini Vision sikeresen beazonosította!");
                  return {
                    ...aiParsed,
                    colorHex: pixelInfo.hex || '#8d5b4c',
                    isGeminiCloud: true
                  };
                }
              } else {
                const errText = await res.text();
                console.error(`Gemini API hiba (${res.status}):`, errText.slice(0, 300));
              }
            } catch (e) {
              console.error("Gemini végpont hiba:", e);
            }
          }
        } catch (err) {
          console.warn("Gemini API globális hiba:", err);
        }
      }

      // 2. Fallback: Gemini nem válaszolt, pixel-alapú becslés (pontatlan!)
      console.warn('⚠️ Gemini API nem adott eredményt, pixel-alapú fallback fut!');
      if (onStatusUpdate) onStatusUpdate("⚠️ AI nem elérhető, becslés szín alapján...");
      await new Promise(r => setTimeout(r, 600));

      return {
        name: pixelInfo.likelyName,
        category: pixelInfo.likelyCategory,
        subCategory: pixelInfo.likelySubCategory,
        color: pixelInfo.name,
        colorHex: pixelInfo.hex,
        material: pixelInfo.likelyMaterial,
        qualityScore: 9.5,
        season: ['tavasz', 'nyar', 'osz'],
        formality: pixelInfo.likelyFormality,
        stylingTip: pixelInfo.likelyTip,
        tags: pixelInfo.likelyTags,
        isGeminiCloud: false
      };
    }

    // Helper: Analyze pixels, colors, textures for shoes vs garments
    function analyzeImagePixels(imageSrc) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(img, 0, 0, 100, 100);

            const imgData = ctx.getImageData(15, 15, 70, 70).data;
            let r = 0, g = 0, b = 0, count = 0;

            for (let i = 0; i < imgData.length; i += 16) {
              const pr = imgData[i];
              const pg = imgData[i+1];
              const pb = imgData[i+2];
              const pa = imgData[i+3];
              if (pa > 120 && (pr+pg+pb > 50) && (pr+pg+pb < 720)) {
                r += pr; g += pg; b += pb; count++;
              }
            }

            const avgR = count ? Math.round(r/count) : 140;
            const avgG = count ? Math.round(g/count) : 100;
            const avgB = count ? Math.round(b/count) : 70;

            const hex = "#" + ((1 << 24) + (avgR << 16) + (avgG << 8) + avgB).toString(16).slice(1);
            let name = "Dohánybarna (Tan/Cognac)";
            const bright = (avgR*299 + avgG*587 + avgB*114)/1000;

            let likelyCategory = 'shoes';
            let likelySubCategory = 'boat_shoes';
            let likelyMaterial = 'Full-grain Nubuk Borjúbőr & Bőrfűző';
            let likelyName = 'Dohánybarna Bőr Vitorláscipő / Loafer';
            let likelyFormality = 'Smart Casual / Sprezzatura';
            let likelyTip = 'Bézs chino nadrággal, felhajtott szárral és kék len inggel igazi olasz riviéra megjelenést ad!';
            let likelyTags = ['prémium bőr', 'kézi moccasin varrás', 'olasz nyár'];

            if (avgR > 120 && avgG > 75 && avgB < 85) {
              name = "Dohánybarna / Cognac Bőr";
              likelyCategory = 'shoes';
              likelySubCategory = 'boat_shoes';
              likelyName = 'Dohánybarna Bőr Vitorláscipő';
              likelyMaterial = 'Full-grain Nubuk Bőr & Bőrfűző';
              likelyTip = 'Bézs chino nadrággal, felhajtott szárral és fehér vagy kék len inggel igazi olasz stílust ad.';
            } else if (bright > 215) {
              name = "Hófehér / Törtfehér";
              likelyCategory = 'tops';
              likelySubCategory = 'shirt';
              likelyName = 'Fehér Egyiptomi Pamut Ingeg';
              likelyMaterial = '100% Egyiptomi Giza Pamut';
              likelyTip = 'Hagyd az ing felső két gombját kigombolva a laza eleganciáért.';
            } else if (avgB > avgR + 15 && avgB > avgG + 10) {
              name = "Sötétkék (Navy)";
              likelyCategory = 'outerwear';
              likelySubCategory = 'blazer';
              likelyName = 'Sötétkék Olasz Gyapjú Zakó';
              likelyMaterial = '100% Super 130s Finomgyapjú';
              likelyTip = 'Hagyd az alsó gombot nyitva a klasszikus olasz szabászati szabályok szerint!';
            } else if (avgR > 160 && avgG > 140 && avgB < 110) {
              name = "Homokbézs / Tevebarna";
              likelyCategory = 'bottoms';
              likelySubCategory = 'trousers';
              likelyName = 'Homokbézs Pamut-Len Chino Nadrág';
              likelyMaterial = '70% Pamut, 30% Len Szövet';
              likelyTip = 'Barna bőr cipővel és felhajtott szárral tökéletes smart-casual szett.';
            }

            resolve({ hex, name, likelyCategory, likelySubCategory, likelyMaterial, likelyName, likelyFormality, likelyTip, likelyTags });
          } catch(e) {
            resolve({ 
              hex: '#8d5b4c', 
              name: 'Dohánybarna', 
              likelyCategory: 'shoes', 
              likelySubCategory: 'boat_shoes',
              likelyMaterial: 'Full-grain Nubuk Bőr', 
              likelyName: 'Dohánybarna Bőr Vitorláscipő', 
              likelyFormality: 'Smart Casual / Sprezzatura', 
              likelyTip: 'Párosítsd chino nadrággal és len inggel!', 
              likelyTags: ['bőr', 'moccasin varrás'] 
            });
          }
        };
        img.onerror = () => resolve({ 
          hex: '#8d5b4c', 
          name: 'Dohánybarna', 
          likelyCategory: 'shoes', 
          likelySubCategory: 'boat_shoes',
          likelyMaterial: 'Full-grain Nubuk Bőr', 
          likelyName: 'Dohánybarna Bőr Vitorláscipő', 
          likelyFormality: 'Smart Casual / Sprezzatura', 
          likelyTip: 'Párosítsd chino nadrággal és len inggel!', 
          likelyTags: ['bőr', 'moccasin varrás'] 
        });
        img.src = imageSrc;
      });
    }

          if (fbDb) {
            try {
              const snap = await fbDb.collection(`users/${uidToUse}/wardrobe`).get();
              if (!snap.empty) {
                snap.docs.forEach(d => loadedMap.set(d.id, { id: d.id, ...d.data() }));
              }
            } catch (e) {
              console.warn("Firestore felhő betöltés:", e);
            }
          }

          // 2. Kísérlet közvetlenül a Firebase Storage mappából (users/attila-wardrobe-primary/wardrobe)
          if (fbStorage) {
            try {
              const storageRef = fbStorage.ref(`users/${uidToUse}/wardrobe`);
              const listRes = await storageRef.listAll();
              console.log("📦 Firebase Storage fájlok száma:", listRes.items.length);
              for (const itemRef of listRes.items) {
                const itemId = itemRef.name.replace(/\.[^/.]+$/, "");
                if (!loadedMap.has(itemId)) {
                  try {
                    const downloadUrl = await itemRef.getDownloadURL();
                    loadedMap.set(itemId, {
                      id: itemId,
                      name: 'Feltöltött Ruha (' + itemRef.name + ')',
                      category: 'tops',
                      subCategory: 'clothing',
                      color: 'Egyedi',
                      colorHex: '#d4af37',
                      material: 'Prémium anyag',
                      qualityScore: 9.0,
                      season: ['tavasz', 'nyar', 'osz', 'tel'],
                      formality: 'Smart Casual',
                      imageUrl: downloadUrl,
                      tags: ['felhőből betöltve', 'storage']
                    });
                  } catch(urlErr) {
                    console.warn("Nem sikerült letölteni a képlinket:", urlErr);
                  }
                }
              }
            } catch (storageErr) {
              console.warn("Firebase Storage listAll hiba:", storageErr);
            }
          }

          if (loadedMap.size > 0) {
            const cloudItems = Array.from(loadedMap.values());
            console.log("☁️ Összesen felhőből szinkronizált elemek:", cloudItems.length);
            setWardrobe(prev => {
              const combined = [...cloudItems];
              for (const item of prev) {
                if (!combined.some(c => c.id === item.id)) {
                  combined.push(item);
                }
              }
              return combined;
            });
          }
        };

        if (fbAuth) {
          const unsubscribe = fbAuth.onAuthStateChanged(async (user) => {
            if (user) {
              const uObj = {
                uid: user.uid,
                email: user.email || 'attila@wardrobe.local',
                displayName: user.displayName || 'Attila',
                photoURL: user.photoURL || null
              };
              setCurrentUser(uObj);
              localStorage.setItem('sa_current_user', JSON.stringify(uObj));
              fetchWardrobeFromCloud(user.uid);
            } else {
              // Ha nincs Google bejelentkezés, próbáljuk meg az attila-wardrobe-primary fiókot
              fetchWardrobeFromCloud('attila-wardrobe-primary');
            }
          });
          return unsubscribe;
        } else {
          fetchWardrobeFromCloud('attila-wardrobe-primary');
        }
      }, []);

      // Local storage sync
      useEffect(() => {
        localStorage.setItem('sa_wardrobe', JSON.stringify(wardrobe));
      }, [wardrobe]);

      // Weather API
      useEffect(() => {
        fetch('https://api.open-meteo.com/v1/forecast?latitude=47.4979&longitude=19.0402&current=temperature_2m,weather_code&timezone=auto')
          .then(r => r.json())
          .then(data => {
            if (data?.current) {
              setWeather({
                city: 'Budapest',
                temperature: Math.round(data.current.temperature_2m),
                condition: 'Valós időjárás',
                icon: data.current.temperature_2m > 18 ? '☀️' : '⛅'
              });
            }
          }).catch(() => {});
      }, []);

      // Add Item (Syncs to Firestore & Storage if logged in)
      const addItem = async (newItem, fileObj) => {
        let finalItem = { ...newItem };

        // If user is connected to Firebase, upload to Storage & Firestore
        const uid = currentUser?.uid || 'attila-wardrobe-primary';

              }
            }
            await fbDb.collection(`users/${uid}/wardrobe`).doc(newItem.id).set(finalItem);
          } catch (err) {
            console.error("Firestore mentési hiba:", err);
          }
        }

        setWardrobe(prev => [finalItem, ...prev]);
        try {
          confetti({ particleCount: 50, spread: 60, colors: ['#d4af37', '#f3e5ab'] });

      };

      // Delete Item
      const deleteItem = async (id) => {
        setWardrobe(prev => prev.filter(i => i.id !== id));

        if (fbDb) {

            await fbDb.collection(`users/${uid}/wardrobe`).doc(id).delete();
          } catch (e) {
            console.warn("Firestore törlési hiba:", e);
          }
        }
      };

      const handleFastDirectLogin = (name = 'Attila', email = 'attila@wardrobe.local') => {

      const handleLogout = async () => {

      return (

                      Gemini Vision AI (Gardrób tanácsadó)

                  </div>
                </div>

              <div className="flex items-center gap-3">

    // --- MODALS ---
    function AddModal({ onClose, onSave }) {
      const [inputMode, setInputMode] = useState('photo'); // 'photo' | 'link'
      const [shopUrl, setShopUrl] = useState('');
      const [name, setName] = useState('');
      const [category, setCategory] = useState('shoes');
      const [color, setColor] = useState('Dohánybarna');
      const [colorHex, setColorHex] = useState('#8d5b4c');
      const [material, setMaterial] = useState('Full-grain Nubuk Borjúbőr & Bőrfűző');
      const [qualityScore, setQualityScore] = useState(9.5);
      const [formality, setFormality] = useState('Smart Casual');
      const [stylingTip, setStylingTip] = useState('');
      const [tags, setTags] = useState(['prémium bőr', 'kézi varrás', 'klasszikus']);
      const [image, setImage] = useState(null);
      const [rawFile, setRawFile] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [statusLog, setStatusLog] = useState('');
      const [aiCompleted, setAiCompleted] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      const fileInput = useRef(null);

      const processImageData = async (b64, extraContext = "") => {
        setImage(b64);
        setIsAnalyzing(true);
        setAiCompleted(false);
        setErrorMessage('');
        try {
          const aiData = await analyzeWithGeminiVision(b64, setStatusLog, extraContext);
          if (aiData) {
            setName(aiData.name || '');
            if (aiData.category) setCategory(aiData.category);
            if (aiData.color) setColor(aiData.color);
            if (aiData.colorHex) setColorHex(aiData.colorHex);
            if (aiData.material) setMaterial(aiData.material);
            if (aiData.qualityScore) setQualityScore(aiData.qualityScore);
            if (aiData.formality) setFormality(aiData.formality);
            if (aiData.stylingTip) setStylingTip(aiData.stylingTip);
            if (aiData.tags) setTags(aiData.tags);
            setAiCompleted(true);
          }
        } catch(err) {
          console.warn("AI hiba:", err);
          setErrorMessage('Nem sikerült az automatikus AI elemzés: ' + err.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleImage = async (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setRawFile(file);
          const reader = new FileReader();
          reader.onloadend = async () => {
            await processImageData(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Áruházi link / termék link feldolgozása
      const handleFetchFromLink = async (e) => {
        e.preventDefault();
        if (!shopUrl.trim()) return;

        setIsAnalyzing(true);
        setStatusLog('🔗 Terméklink vizsgálata és kép betöltése...');
        setErrorMessage('');
        setAiCompleted(false);

        try {
          const targetUrl = shopUrl.trim();
          let fetchedImageBase64 = null;

          // Ha közvetlen képlink
          if (/\.(jpeg|jpg|png|webp|avif)(\?.*)?$/i.test(targetUrl)) {
            const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
            const blob = await proxyRes.blob();
            fetchedImageBase64 = await new Promise(resolve => {
              const r = new FileReader();
              r.onloadend = () => resolve(r.result);
              r.readAsDataURL(blob);
            });
          } else {
            // Webshop HTML scrapelése több megbízható proxyval
            setStatusLog('🌐 Webáruház metaadatok és fotó kinyerése...');
            
            let html = '';
            const proxies = [
              (u) => `/api/proxy?url=${encodeURIComponent(u)}`,
              (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
              (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
            ];

            for (const pUrl of proxies) {
              try {
                const proxyRes = await fetch(pUrl(targetUrl));
                if (proxyRes.ok) {
                  const contentType = proxyRes.headers.get('content-type') || '';
                  if (contentType.includes('application/json')) {
                    const data = await proxyRes.json();
                    html = data?.contents || (typeof data === 'string' ? data : JSON.stringify(data));
                  } else {
                    html = await proxyRes.text();
                  }
                  if (html && html.length > 200) break;
                }
              } catch(e) {
                console.warn("Proxy próbálkozás:", e);
              }
            }

            if (!html) throw new Error('A webáruház védelme miatt nem sikerült közvetlenül beolvasni az oldalt.');

            const doc = new DOMParser().parseFromString(html, 'text/html');

            // 1. Meta képek (OpenGraph, Twitter, Schema)
            let imgUrl = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') ||
                         doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content') ||
                         doc.querySelector('meta[property="og:image:secure_url"]')?.getAttribute('content') ||
                         doc.querySelector('link[rel="image_src"]')?.getAttribute('href');

            // 2. JSON-LD strukturált adatok keresése
            if (!imgUrl) {
              const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
              for (const s of scripts) {
                try {
                  const json = JSON.parse(s.textContent);
                  const pImg = json.image || json.images || (Array.isArray(json['@graph']) && json['@graph'].find(g => g.image)?.image);
                  if (pImg) {
                    imgUrl = Array.isArray(pImg) ? (pImg[0]?.url || pImg[0]) : (pImg.url || pImg);
                    if (typeof imgUrl === 'string') break;
                  }
                } catch(_) {}
              }
            }

            // 3. Fő termékkép keresése az <img> tagek között
            if (!imgUrl) {
              const mainImg = doc.querySelector('img[data-zoom-image], img[src*="product"], img[src*="photos"], main img, .product img');
              if (mainImg) {
                imgUrl = mainImg.getAttribute('data-zoom-image') || mainImg.getAttribute('data-src') || mainImg.getAttribute('src');
              }
            }

            // 4. Szöveges leírás, anyagösszetétel és részletek kinyerése
            const ogTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') ||
                            doc.querySelector('h1')?.textContent ||
                            doc.title;
            if (ogTitle) setName(ogTitle.replace(/\|.*|-.*$/g, '').trim());

            const ogDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content') ||
                           doc.querySelector('meta[name="description"]')?.getAttribute('content') || '';
            
            // Termékleírás elemek kigyűjtése a webshopból
            const descElements = doc.querySelectorAll('.description, [class*="description"], [class*="composition"], [class*="material"], [id*="description"], [id*="details"], article, .product-info');
            let scrapedText = Array.from(descElements).map(el => el.textContent.trim()).filter(Boolean).join('\n');
            if (scrapedText.length > 2000) scrapedText = scrapedText.slice(0, 2000);

            const fullContext = `Cím: ${ogTitle || ''}\nMeta leírás: ${ogDesc}\nOldal részletek: ${scrapedText || 'Nincs külön szöveges mező.'}`;

            if (imgUrl) {
              const fullImgUrl = imgUrl.startsWith('http') ? imgUrl : new URL(imgUrl, targetUrl).href;
              console.log("Megtalált termékkép URL:", fullImgUrl);

              // Kép letöltése és konvertálása Base64-be
              let imgBlob = null;
              const imgProxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(fullImgUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(fullImgUrl)}`,
                fullImgUrl
              ];

              for (const ip of imgProxies) {
                try {
                  const r = await fetch(ip);
                  if (r.ok) {
                    imgBlob = await r.blob();
                    if (imgBlob && imgBlob.size > 500) break;
                  }
                } catch(_) {}
              }

              if (imgBlob) {
                fetchedImageBase64 = await new Promise(resolve => {
                  const r = new FileReader();
                  r.onloadend = () => resolve(r.result);
                  r.readAsDataURL(imgBlob);
                });
              } else {
                // Fallback: Ha a proxy nem tudja letölteni a bináris képet
                setImage(fullImgUrl);
                setIsAnalyzing(false);
                setAiCompleted(true);
                return;
              }
            } else {
              throw new Error('A megadott linkről nem sikerült automatikusan megtalálni a termékfotót. Kérlek másold ki közvetlenül a kép címét (jobb klikk -> Kép címének másolása), vagy töltsd fel fájlként!');
            }

            if (fetchedImageBase64) {
              await processImageData(fetchedImageBase64, fullContext);
              return;
            }
          }

          if (fetchedImageBase64) {
            await processImageData(fetchedImageBase64);
          }
        } catch (err) {
          console.error("Link import hiba:", err);
          setIsAnalyzing(false);
          setErrorMessage(err.message || 'Nem sikerült betölteni a link tartalmát.');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: 'item-' + Date.now(),
          name: name || 'Új Ruhadarab',
          category,
          color,
          colorHex,
          material,
          qualityScore: Number(qualityScore),
          formality,
          stylingTip,
          imageUrl: image || 'https://images.unsplash.com/photo-1533867617858-e7b97e060509?auto=format&fit=crop&w=800&q=80',
          sourceUrl: shopUrl || null,
          season: ['tavasz', 'nyar', 'osz'],
          tags: tags
        }, rawFile);
        onClose();
      };

      return (
        <div className="modal-backdrop">
          <div className="glass-card max-w-md w-full p-6 space-y-4 max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-2 border-b border-white/10">
              <div>
                <h3 className="font-serif font-bold text-lg text-white">Új Ruha / Cipő Hozzáadása</h3>
                <p className="text-[10px] text-gray-400">Fotóval vagy Webshop Linkkel + AI Elemzés</p>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
            </div>

            {/* Input Mode Selector Tabs */}
            <div className="grid grid-cols-2 p-1 bg-black/40 rounded-xl border border-white/10 text-xs font-semibold">
              <button 
                type="button"
                onClick={() => setInputMode('photo')} 
                className={`py-1.5 rounded-lg transition-all ${inputMode === 'photo' ? 'bg-[#d4af37] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}
              >
                📸 Fotó / Feltöltés
              </button>
              <button 
                type="button"
                onClick={() => setInputMode('link')} 
                className={`py-1.5 rounded-lg transition-all ${inputMode === 'link' ? 'bg-[#d4af37] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}
              >
                🔗 Áruházi Link
              </button>
            </div>

            {inputMode === 'link' && (
              <div className="space-y-2 p-3 bg-white/5 border border-white/10 rounded-xl">
                <label className="text-xs text-[#f3e5ab] font-medium block">Webáruház terméklink vagy közvetlen képcím</label>
                <div className="flex gap-2">
                  <input 
                    type="url" 
                    value={shopUrl}
                    onChange={e => setShopUrl(e.target.value)}
                    placeholder="https://zarahome.com/... vagy https://answear.hu/..."
                    className="custom-input text-xs flex-1"
                  />
                  <button 
                    type="button"
                    disabled={isAnalyzing || !shopUrl.trim()}
                    onClick={handleFetchFromLink}
                    className="px-3 py-1.5 bg-[#d4af37] text-black font-bold text-xs rounded-xl hover:bg-[#f3e5ab] transition-all disabled:opacity-50 flex items-center gap-1 shrink-0"
                  >
                    {isAnalyzing ? 'Betöltés...' : 'Import'}
                  </button>
                </div>
                <p className="text-[10px] text-gray-400">Automatikusan letölti a termékfotót és kitölti az AI adatlapot.</p>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              {/* Image Picker / Preview */}
              <div 
                onClick={() => inputMode === 'photo' && fileInput.current?.click()} 
                className="aspect-[16/9] border-2 border-dashed border-[#d4af37] rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden bg-black/40 relative group"
              >
                <input ref={fileInput} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleImage} />
                
                {image ? (
                  <>
                    <img src={image} alt="Upload" className="w-full h-full object-cover" />
                    {isAnalyzing && <div className="scanner-active"></div>}
                  </>
                ) : (
                  <div className="text-center p-4">
                    <span className="text-3xl block mb-1">{inputMode === 'photo' ? '📸' : '🔗'}</span>
                    <span className="text-xs font-semibold text-white block">
                      {inputMode === 'photo' ? 'Fotózz telefonnal vagy válassz képet' : 'Illessz be egy linket felül és kattints az Importra'}
                    </span>
                    <span className="text-[10px] text-gray-400">
                      {inputMode === 'photo' ? 'Kattints a kamera megnyitásához' : 'A termékfotó itt fog megjelenni'}
                    </span>
                  </div>
                )}

                {/* AI Analyzing Overlay */}
                {isAnalyzing && (
                  <div className="absolute inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-3">
                    <div className="w-8 h-8 rounded-full border-2 border-[#d4af37] border-t-transparent animate-spin mb-2"></div>
                    <span className="text-xs font-bold text-[#f3e5ab] tracking-wide">
                      {statusLog || "✨ Gemini AI elemzi a ruhadarabot..."}
                    </span>
                    <span className="text-[10px] text-gray-400 mt-0.5">
                      Anyag, szín és stílus felismerése
                    </span>
                  </div>
                )}
              </div>

              {/* Error Notification */}
              {errorMessage && (
                <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-xs text-rose-300">
                  ⚠️ {errorMessage}
                </div>
              )}

              {/* AI Recognition Badge */}
              {aiCompleted && (
                <div className="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs text-emerald-300 flex items-center gap-2">
                  <span>✨</span>
                  <span><strong>Felismerve:</strong> {name} ({color}), adatok és stílustipp kitöltve!</span>
                </div>
              )}

              {/* Editable Fields */}
              <div>
                <label className="text-xs text-gray-400 block mb-1">Megnevezés</label>
                <input 
                  type="text" 
                  required 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="pl. Dohánybarna Bőr Vitorláscipő" 
                  className="custom-input text-sm" 
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Kategória</label>
                  <select value={category} onChange={e => setCategory(e.target.value)} className="custom-input text-sm">
                    <option value="shoes">Cipő & Lábbeli</option>
                    <option value="outerwear">Zakó & Kabát</option>
                    <option value="tops">Felső / Ing</option>
                    <option value="bottoms">Nadrág</option>
                    <option value="accessories">Kiegészítő</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Formalitás</label>
                  <select value={formality} onChange={e => setFormality(e.target.value)} className="custom-input text-sm">
                    <option value="Sprezzatura / Smart Casual">Sprezzatura</option>
                    <option value="Smart Casual">Smart Casual</option>
                    <option value="Business">Business / Elegáns</option>
                    <option value="Casual">Casual / Laza</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Anyag & Szövés</label>
                  <input type="text" value={material} onChange={e => setMaterial(e.target.value)} className="custom-input text-sm" />
                </div>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Felismerte Szín</label>
                  <div className="flex items-center gap-1.5">
                    <input type="color" value={colorHex} onChange={e => setColorHex(e.target.value)} className="w-8 h-8 rounded bg-transparent border-0 cursor-pointer" />
                    <input type="text" value={color} onChange={e => setColor(e.target.value)} className="custom-input text-xs" />
                  </div>
                </div>
              </div>

              {stylingTip && (
                <div className="p-2.5 rounded-xl bg-black/40 border border-white/10 text-xs text-amber-200">
                  💡 <strong>AI Stílustipp:</strong> {stylingTip}
                </div>
              )}

              <div>
                <label className="text-xs text-gray-400 block mb-1">AI Címkék:</label>
                <div className="flex gap-1.5 flex-wrap">
                  {tags.map((t, i) => (
                    <span key={i} className="badge badge-gold text-[10px]">#{t}</span>
                  ))}
                </div>
              </div>

              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="btn-secondary flex-1 text-xs">Mégse</button>
                <button type="submit" disabled={isAnalyzing} className="btn-gold flex-1 text-xs">Mentés Firebase-be</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function DetailModal({ item, onClose, onDelete }) {
      return (
        <div className="modal-backdrop">
          <div className="glass-card max-w-md w-full p-6 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-white/10">
              <span className="badge badge-gold">{item.formality}</span>
              <div className="flex gap-2">
                <button onClick={() => { onDelete(item.id); onClose(); }} className="text-rose-400 text-xs hover:underline">Törlés</button>
                <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
              </div>
            </div>

            <div className="aspect-[4/3] rounded-xl overflow-hidden bg-black/40">
              <img src={item.imageUrl} alt={item.name} className="w-full h-full object-cover" />
            </div>

            <div>
              <h3 className="font-serif font-bold text-xl text-white">{item.name}</h3>
              <p className="text-xs text-gray-400 mt-1">Anyag: {item.material} • Szín: {item.color}</p>
              {item.qualityScore && (
                <div className="mt-2 text-xs text-amber-300">
                  Minőségi Index: <strong>{item.qualityScore} / 10</strong>
                </div>
              )}
              {item.stylingTip && (
                <div className="mt-3 p-2.5 rounded-xl bg-black/40 border border-white/10 text-xs text-amber-200">
                  💡 <strong>Stílustipp:</strong> {item.stylingTip}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function AuthModal({ user, onClose, onFastLogin, onLogout }) {
      const [email, setEmail] = useState('attila@wardrobe.local');
      const [name, setName] = useState('Attila');

      return (
        <div className="modal-backdrop">
          <div className="glass-card max-w-sm w-full p-6 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-white/10">
              <h3 className="font-serif font-bold text-lg text-white">Személyes Fiók & Firebase Belépés</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
            </div>

            {user ? (
              <div className="space-y-4 text-center">
                {user.photoURL ? (
                  <img src={user.photoURL} alt="Avatar" className="w-16 h-16 rounded-full mx-auto" />
                ) : (
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#d4af37] to-[#785908] flex items-center justify-center text-black font-bold text-2xl mx-auto shadow-lg">
                    {user.displayName?.[0] || 'A'}
                  </div>
                )}
                <div>
                  <h4 className="font-bold text-white text-base">{user.displayName}</h4>
                  <p className="text-xs text-gray-400">{user.email}</p>
                </div>
                <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-400">
                  ✓ Valós idejű felhő Firestore szinkronizáció aktív!
                </div>
                <button onClick={onLogout} className="btn-secondary w-full text-xs text-rose-400">Kijelentkezés</button>
              </div>
            ) : (
              <div className="space-y-4">
                <p className="text-xs text-gray-300 leading-relaxed">
                  Lépj be a neveddel, és az alkalmazás azonnal a <strong>wardrobe-assistant-48e01</strong> Firestore adatbázisodba ment minden darabot!
                </p>

                <div className="space-y-2">
                  <div>
                    <label className="text-[11px] text-gray-400 block mb-1">Név:</label>
                    <input
                      type="text"
                      value={name}
                      onChange={e => setName(e.target.value)}
                      className="custom-input text-xs"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-gray-400 block mb-1">Email / Azonosító:</label>
                    <input
                      type="text"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      className="custom-input text-xs"
                    />
                  </div>
                </div>

                <button
                  onClick={() => onFastLogin(name, email)}
                  className="btn-gold w-full py-3 text-sm shadow-lg"
                >
                  <span>✨ Belépés Attilaként (Azonnali Szinkronizáció)</span>
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsModal({ onClose }) {
      const [key, setKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || BAKED_GEMINI_KEY);
      const [saved, setSaved] = useState(false);

      const handleSave = (e) => {
        e.preventDefault();
        localStorage.setItem('GEMINI_API_KEY', key.trim());
        setSaved(true);
        setTimeout(() => {
          setSaved(false);
          onClose();
        }, 800);
      };

      return (
        <div className="modal-backdrop">
          <div className="glass-card max-w-sm w-full p-6 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-white/10">
              <div className="flex items-center gap-2">
                <span className="text-lg">🧠</span>
                <h3 className="font-serif font-bold text-lg text-white">Google Gemini AI Kulcs</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-3">
              <div>
                <label className="text-xs text-gray-300 block mb-1 font-semibold">Aktív Gemini API Kulcs (Gardrób tanácsadó):</label>
                <input
                  type="text"
                  placeholder="AQ..."
                  value={key}
                  onChange={e => setKey(e.target.value)}
                  className="custom-input text-xs font-mono"
                />
                <p className="text-[11px] text-emerald-400 mt-2 leading-relaxed">
                  ✓ A <strong>Gardrób tanácsadó</strong> Google AI Studio projekted kulcsa be van építve és aktív!
                </p>
              </div>

              <div className="pt-2">
                <button type="submit" className="btn-gold w-full text-xs">
                  {saved ? '✓ Mentve!' : 'Mentés'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
